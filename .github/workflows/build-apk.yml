
name: Build JARVIS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip ant \
            openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake \
            build-essential

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Create Buildozer spec
        run: |
          buildozer init
          sed -i 's/^title = .*/title = JARVIS/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = jarvis/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = com.easytoon/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,atlas,json/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,requests/' buildozer.spec
          echo "android.permissions = INTERNET" >> buildozer.spec
          echo "android.archs = arm64-v8a" >> buildozer.spec

      - name: Build APK
        run: |
          java -version
          ant -version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
